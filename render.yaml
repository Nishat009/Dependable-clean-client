services:
  - type: web
    name: dependable-clean-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: houseCleaning
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      # This deployment is the public demo, with no real customer data. Leave DEMO_ACCOUNTS out for a real launch.
      - key: DEMO_ACCOUNTS
        value: "on"
      - key: AUTH_SECRET
        generateValue: true
