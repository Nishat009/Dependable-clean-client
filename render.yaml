services:
  - type: web
    name: dependable-clean-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --workspaces=false
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: houseCleaning
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
